  M0:
    title: Design and inventory
    status: done
    dependencies: []
    assigned_role: astra-max
  M0.5:
    title: Existing mathematics and live reader review
    status: todo
    dependencies:
    - M0
    assigned_role: math-site-editor
  M1:
    title: Approved exceedance-fraction pilot after teaching and numerical review
    status: todo
    dependencies:
    - M0.5
    assigned_role: astra-max
  M2:
    title: Technical Incerto mathematical teaching and numerical illustrations
    status: todo
    dependencies:
    - M1
    assigned_role: astra-xhigh
  M3:
    title: Tail estimation, mathematical paper models and data studies
    status: todo
    dependencies:
    - M2
    assigned_role: astra-xhigh
  M4:
    title: Dynamic Hedging teaching and numerics including continuous time
    status: todo
    dependencies:
    - M3
    assigned_role: astra-max
  M5:
    title: Technical coverage closeout and optional declaration-level Lean
    status: todo
    dependencies:
    - M2
    - M3
    - M4
    assigned_role: math-site-editor
next_chunk: '#/chunks/m0.5-review'
chunks:
  m0.5-review:
    id: m0.5-review
    title: Review the 24 existing concept bodies and corresponding live pages for Xiang
    status: todo
    dependencies: []
    assigned_role: math-site-editor
    milestone: M0.5
    concept_ids:
    - c-exceedances
    - c-pareto
    - c-regular-variation
    - c-karamata
    - c-pareto-moments
    - c-mean-excess
    - c-hill
    - c-evi
    - c-gpd
    - c-plugin
    - c-pbdh
    - c-gev
    - c-frechet
    - c-subexponential
    - c-tail-ratio
    - c-max-sum
    - c-double-pareto
    - c-threshold
    - c-body-shoulder
    - c-tail-geometry
    - c-cramer
    - c-stable-clt
    - c-lln-failure
    - c-tail-catalog
    review_workstreams:
      mathematics:
        assigned_role: astra-max
        method: claim-by-claim source review, with hypotheses, proof/citation status and numerical-evidence limits
      reader:
        assigned_role: math-site-editor
        method: read every corresponding live page; review explanation, equations, figures, links and desktop/mobile
          navigation
    output_path: docs/plan/incerto-program/m0.5-review.md
    acceptance:
    - Record source revision, live deployment/date and a coverage row for every one of the 24 bodies; exclude the
      hub and three indexes from this denominator.
    - Astra max records each mathematical claim and its review result; any unchecked claim remains explicit.
    - Math Site Editor records live reader findings for all 24 corresponding URLs; inaccessible pages stay unreviewed.
    - Provide Xiang one issues list with stable IDs, severity, source/live locator, evidence, proposed action, reviewer
      and disposition.
    - Record Xiang decisions and unresolved findings; resolve findings that affect the M1 claims before starting
      the pilot.
    - Apply the standing live reader review after every later site update.
  m1-scope:
    id: m1-scope
    title: Review the approved page and numerical example, then pin a feasible Lean toolchain
    status: todo
    dependencies:
    - m0.5-review
    assigned_role: astra-max
    milestone: M1
    concept_ids:
    - c-exceedances
    acceptance:
    - Record n >= 1, real observations, strict > u, bounds and antitonicity at the approved scope.
    - Resolve M0.5 findings affecting this page; review its teaching and run the existing numerical example before
      Lean work.
    - Find suitable pinned Mathlib finite-set lemmas; record exact Lean and Mathlib versions.
    - Use the recorded owner approval without asking again; this design-only revision creates no Lean project.
    owner_approval: owner_decisions.m1-pilot; exact informal claims approved, implementation remains a later task
  m1-proof:
    id: m1-proof
    title: Implement and audit the two finite-count results
    status: todo
    dependencies:
    - m1-scope
    assigned_role: astra-max
    milestone: M1
    concept_ids:
    - c-exceedances
    acceptance:
    - Build the imported module with no sorry/admit or new placeholder axioms.
    - Review declaration hypotheses and dependency axioms against the informal statements.
  m1-integration:
    id: m1-integration
    title: Link checked declarations and retain the existing numerical example
    status: todo
    dependencies:
    - m1-proof
    assigned_role: astra-xhigh
    milestone: M1
    concept_ids:
    - c-exceedances
    acceptance:
    - Link the exact checked declaration at an immutable revision.
    - Run the existing example and relevant Python, Lean, site, and HTML checks.
    - Record proof versus floating-point implementation limits.
  m1-checks:
    id: m1-checks
    title: Review local and proposed CI checks
    status: todo
    dependencies:
    - m1-integration
    assigned_role: cursor-grok
    milestone: M1
    concept_ids:
    - c-exceedances
    acceptance:
    - Review root imports and failure-on-placeholder behavior.
    - Review separate Lean, Python, and site jobs if CI is introduced.
    - Math Site Editor records evidence before closing M1.
    - After any site update, Math Site Editor reviews the live reader view and records findings.
  m2-moments:
    id: m2-moments
    title: Moment-estimation failure, first queued new note
    status: todo
    dependencies:
    - m1-checks
    assigned_role: astra-max
    milestone: M2
    concept_ids:
    - c-pareto-moments
    - c-plugin
    - c-moment-estimation
    acceptance:
    - Scope exact claims and finite versus infinite moments before original writing.
    - Reconcile the selected source chapter and citation locators.
    - Complete website teaching first and numerical illustrations second; any Lean work is optional and last.
  m2-inference:
    id: m2-inference
    title: Inference asymmetry, second queued new note
    status: todo
    dependencies:
    - m2-moments
    assigned_role: astra-max
    milestone: M2
    concept_ids:
    - c-inference-asymmetry
    acceptance:
    - State and verify one finite-sample contamination counterexample.
    - Keep the result a model-relative mathematical counterexample; no philosophical induction note is required.
  m2-cauchy:
    id: m2-cauchy
    title: Bounded Cauchy running-statistics simulation
    status: todo
    dependencies:
    - m2-inference
    assigned_role: astra-xhigh
    milestone: M2
    concept_ids:
    - c-cauchy-running
    acceptance:
    - Use a fixed seed, repeated paths, bounded runtime, and uncertainty summaries.
    - Resolve the old Chapter 4 locator; classify synthetic data as numeric-demo.
  edition-review:
    id: edition-review
    title: Reconcile selected editions and supplemental units
    status: todo
    dependencies: []
    assigned_role: math-site-editor
    milestone: M2
    concept_ids: []
    acceptance:
    - Compare the two technical books with their mathematical chapter maps; verify supplements and exact claim locators.
    - Reconcile the required 2025 Technical Incerto additions without renumbering existing IDs; no non-technical
      edition review is required.
    - Pin exact paper sections and theorem locators on demand for concrete mathematical claims.
