  assigned_role: math-site-editor
  target: corresponding live pages read as a reader, with desktop and mobile checks
  record_path_pattern: docs/records/incerto-site-review-YYYY-MM-DD.md
  required_evidence:
  - deployment-revision
  - review-date
  - live-URLs
  - reader-findings
  - issue-dispositions
  closure: A site update remains pending reader review until the live review is recorded.
