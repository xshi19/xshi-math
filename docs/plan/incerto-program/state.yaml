status_semantics:
  todo: Program work has not satisfied its evidence gates; existing prose is recorded separately.
  in-progress: A named chunk is active and has a recorded checkpoint.
  done: Required artifacts, source review, and applicable checks are recorded; a source unit closes only when its
    mapped scope is reviewed.
  concept_dependencies: Conceptual prerequisites, not a requirement to finish every evidence mode first. Only chunk
    and milestone dependencies are execution gates.
  out-of-scope: Retained stable ID excluded from completion; reason is mandatory, no milestone or deliverables are
    required.
completion_policy:
  book_priority:
  - scft
  - dh
  included: SCoFT 2025 third edition, arXiv:2001.10488v4; Dynamic Hedging; mathematical claims from attached papers.
  excluded_book_ids:
  - fbr
  - tbs
  - bop
  - af
  - sitg
  excluded_book_use: Cited origin cross-reference only; no chapter coverage, interpretive notes or prose-only completion.
  paper_inclusion: approved-on-demand-for-concrete-claims
  deliverable_order:
  - website-math
  - python
  - lean
  lean_optional: true
  lean_evidence_scope: exact-declaration
  missing_mathlib_support: skipped-for-now with a claim-specific reason; does not block teaching or numerics
  source_unit_closeout: Review mathematical scope and required_concept_ids; retained excluded associations are not
    completion requirements.
  work_order: M0.5 review; SCoFT v4 chapters 1-30; Dynamic Hedging chapters 1-23; coverage closeout.
  chapter_chunk_rule: One resumable chunk per numbered chapter. Attach supporting appendices, modules and on-demand
    papers; preserve chapter order.
  prerequisite_policy: Use reviewed pages or a bounded cited prerequisite within the current chapter; conceptual
    dependencies do not reorder chapter chunks.
  stochastic_calculus_depth: Basics only as needed to explain Dynamic Hedging concepts; no standalone advanced stochastic-calculus
    course.
  optional_lean_closure: Lean may be completed or skipped with a reason after teaching and demos; it never blocks
    a chapter or later chapter. The exceedance pilot is optional in scft-v4-ch02.
