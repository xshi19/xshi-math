# Canonical program inventory. See validation.md for semantics and checks.
schema_version: 2
updated: '2026-10-17'
repository: xshi19/xshi-math
baseline_revision: 998a4a11a17b7ae7ba4c306005a4c8e3109f4392
branch: plan/incerto-program
scope: design-only
implementation_authorized: false
status_semantics:
  todo: Program work has not satisfied its evidence gates; existing prose is recorded separately.
  in-progress: A named chunk is active and has a recorded checkpoint.
  done: Required artifacts, source review, and applicable checks are recorded; a source unit closes only when its
    mapped scope is reviewed.
  concept_dependencies: Conceptual prerequisites, not a requirement to finish every evidence mode first. Only chunk
    and milestone dependencies are execution gates.
  out-of-scope: Retained stable ID excluded from completion; reason is mandatory, no milestone or deliverables are
    required.
completion_policy:
  book_priority:
  - scft
  - dh
  included: Technical Incerto including 2025 additions, Dynamic Hedging including continuous time, and mathematical
    claims from papers.
  excluded_book_ids:
  - fbr
  - tbs
  - bop
  - af
  - sitg
  excluded_book_use: Cited origin cross-reference only; no chapter coverage, interpretive notes or prose-only completion.
  paper_inclusion: approved-on-demand-for-concrete-claims
  deliverable_order:
  - website-math
  - python
  - lean
  lean_optional: true
  lean_evidence_scope: exact-declaration
  missing_mathlib_support: skipped-for-now with a claim-specific reason; does not block teaching or numerics
  source_unit_closeout: Review mathematical scope and required_concept_ids; retained excluded associations are not
    completion requirements.
data_policy:
  financial:
    assigned_role: portfolio-manager
    source: Xiang's financial database
    additions: Request missing series or fields from the Portfolio Manager bot.
  other:
    assigned_role: data-scientist
    source: Data Scientist bot
  per_dataset_required:
  - provider
  - version-or-snapshot
  - retrieval-date
  - license-and-redistribution-terms
  - provenance
  - checksum
  - cleaning-and-units
  acquisition: Separate from site rendering; bot routing does not establish redistribution rights.
site_review_policy:
  trigger: after every site update
  assigned_role: math-site-editor
  target: corresponding live pages read as a reader, with desktop and mobile checks
  record_path_pattern: docs/records/incerto-site-review-YYYY-MM-DD.md
  required_evidence:
  - deployment-revision
  - review-date
  - live-URLs
  - reader-findings
  - issue-dispositions
  closure: A site update remains pending reader review until the live review is recorded.
owner_decisions:
  math-first:
    date: '2026-10-17'
    status: approved
    decision: Two technical books plus mathematical papers; Statistical Consequences of Fat Tails is first and highest
      priority.
  deliverable-priority:
    date: '2026-10-17'
    status: approved
    decision: Website math teaching first, Python numerical illustrations/visualizations/worked cases second, optional
      Lean last.
  lean-claim-scope:
    date: '2026-10-17'
    status: approved
    decision: Evidence attaches to the exact checked declaration, never an entire concept or page by association.
  m1-pilot:
    date: '2026-10-17'
    status: approved
    decision: The exceedance-fraction bounds and threshold antitonicity pilot follows M0.5; no repeat scope approval
      is needed.
  m0.5-review:
    date: '2026-10-17'
    status: approved
    decision: Astra max reviews claims in all 24 existing concept bodies; Math Site Editor reviews their live reader
      views and reports issues to Xiang.
  data-routing:
    date: '2026-10-17'
    status: approved
    decision: Financial data and additions through Portfolio Manager; all other data through Data Scientist; retain
      dataset licensing and provenance.
  paper-inclusion:
    date: '2026-10-17'
    status: approved
    decision: Add versioned papers on demand when a concrete mathematical claim needs them.
open_questions:
  shadow-mean:
    question: How much of Shadow Mean belongs in the first note?
    default: Begin with the bounded transform and its assumptions; separate historical estimates.
    concept_ids:
    - c-shadow-mean
  stochastic-calculus-depth:
    question: How deep should the continuous-time teaching and numerical treatment go?
    default: Continuous time is in scope; choose exposition and numerical depth. Lean is skipped-for-now where support
      is not established.
    concept_ids:
    - c-brownian
    - c-stochastic-pricing
    - c-numeraire
  technical-incerto-2025:
    question: How do the 2025 additions and revised locators correspond to the 2020 map?
    default: Inclusion is settled; reconcile exact claims, chapters and appendix from the source without renumbering
      stable IDs.
    edition_backlog_id: edition-scft-v4
roles:
  astra-max:
    client: Codex
    model: gpt-6-astra
    reasoning: max
    owns: hard mathematics, claim-by-claim M0.5 review, optional Lean, design
  astra-xhigh:
    client: Codex
    model: gpt-6-astra
    reasoning: xhigh
    owns: writing and complex code
  cursor-grok:
    client: Cursor
    model: Grok 4.7
    reasoning: xhigh
    owns: simple code, review, site code
  math-site-editor:
    client: Math Site Editor
    owns: manager, source reconciliation, chunk selection, live reader review after every site update, evidence
      records
  portfolio-manager:
    client: Portfolio Manager bot
    owns: financial data from Xiang's financial database; additions requested there
  data-scientist:
    client: Data Scientist bot
    owns: all other data requests and acquisition support
role_constraints:
- Owner explicitly selected gpt-6-astra at max reasoning for this revision.
- No Cursor third-party models.
- Role assignments describe future work, not availability or permission to delegate.
