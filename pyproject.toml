[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xshi-math"
version = "0.1.0"
description = "Educational numerical helpers for the xshi-math notes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xiang Shi" }]
dependencies = ["numpy>=2.4,<3"]

[project.urls]
Repository = "https://github.com/xshi19/xshi-math"

[dependency-groups]
dev = ["pytest>=9,<10"]

# Explicit mapping avoids adding src/ to sys.path or installing a math package.
# List future xmath subpackages and their directories here as they are added.
[tool.setuptools]
packages = ["xmath"]

[tool.setuptools.package-dir]
xmath = "src/math"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
